<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سيريا بايك - المطعم</title>
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#f4f4f4; }
  header { background:#e65100; color:white; padding:16px; text-align:center; font-size:22px; font-weight:bold; }
  .pick { padding:12px; }
  .pick select { width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc; }
  .info { padding:0 12px 6px 12px; color:#555; text-align:center; }
  .order { background:white; border-radius:12px; padding:14px; margin:10px 12px; }
  .order h3 { margin:0 0 8px 0; }
  .item { padding:4px 0; font-size:17px; }
  .addr { color:#666; margin:10px 0; padding-top:8px; border-top:1px solid #eee; }
  .status { display:inline-block; padding:4px 12px; border-radius:20px; font-size:14px; margin-bottom:8px; }
  .new { background:#ffe0b2; color:#e65100; }
  .cooking { background:#fff9c4; color:#f57f17; }
  .ready { background:#c8e6c9; color:#2e7d32; }
  .order button { width:100%; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:bold; color:white; background:#e65100; }
  .order button.done { background:#2e7d32; }
  .empty { text-align:center; color:#888; padding:30px; }
</style>
</head>
<body>
<header>🍽️ واجهة المطعم</header>

<div class="pick">
  <select id="shop">
    <option>مطعم الشام</option>
    <option>فلافل أبو علي</option>
    <option>حلويات الغوطة</option>
    <option>مشاوي الريف</option>
    <option>سوبر ماركت النور</option>
    <option>ميني ماركت الحي</option>
  </select>
</div>
<div class="info" id="info"></div>
<div id="orders"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDh6GFQR5CzjnRLsrTS5FhWrHRZmLG5QSc",
  authDomain: "syria-bike.firebaseapp.com",
  projectId: "syria-bike",
  storageBucket: "syria-bike.firebasestorage.app",
  messagingSenderId: "417884008874",
  appId: "1:417884008874:web:f95dc7c3886c765b3bbbd3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const labels = {new:'طلب جديد', cooking:'قيد التحضير', ready:'جاهز للتسليم'};
let allOrders = [];

onSnapshot(collection(db, 'orders'), function(snap) {
  allOrders = snap.docs.map(function(d) {
    const o = d.data();
    o.id = d.id;
    return o;
  });
  render();
});

document.getElementById('shop').addEventListener('change', render);

function render() {
  const shop = document.getElementById('shop').value;
  const mine = allOrders.filter(function(o) {
    return (o.state === 'new' || o.state === 'cooking') &&
      o.items.some(function(i) { return i.shop === shop; });
  });
  document.getElementById('info').textContent = 'عدد الطلبات الحالية: ' + mine.length;
  if (mine.length === 0) {
    document.getElementById('orders').innerHTML = '<div class="empty">لا يوجد طلبات حالياً</div>';
    return;
  }
  document.getElementById('orders').innerHTML = mine.map(function(o) {
    const items = o.items.filter(function(i) { return i.shop === shop; })
      .map(function(i) { return '<div class="item">• ' + i.n + ' × ' + i.q + '</div>'; }).join('');
    let btn;
    if (o.state === 'new') btn = '<button class="act" data-id="' + o.id + '" data-s="cooking">قبول الطلب</button>';
    else btn = '<button class="act done" data-id="' + o.id + '" data-s="ready">جاهز للتسليم</button>';
    return '<div class="order"><span class="status ' + o.state + '">' + labels[o.state] + '</span>' +
      '<h3>طلب رقم ' + o.id.slice(0, 6) + '</h3>' + items +
      '<div class="addr">📍 ' + o.address + '</div>' + btn + '</div>';
  }).join('');
}

document.addEventListener('click', async function(e) {
  const t = e.target;
  if (t.classList.contains('act')) {
    await updateDoc(doc(db, 'orders', t.dataset.id), { state: t.dataset.s });
  }
});
</script>
</body>
</html>
