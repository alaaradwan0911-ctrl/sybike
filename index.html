<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سيريا بايك</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#622485">
<style>
  html, body { margin:0; }
  body { font-family:Arial,sans-serif; background:#f4f4f4; }
  header { background:#2e7d32; color:white; padding:16px; text-align:center; font-size:22px; font-weight:bold; position:relative; display:none; }
  #roleBtn { position:absolute; left:10px; top:12px; background:rgba(255,255,255,0.2); color:white; border:none; padding:6px 12px; border-radius:8px; font-size:13px; }
  #logoutBtn { position:absolute; right:10px; top:12px; background:rgba(255,255,255,0.2); color:white; border:none; padding:6px 12px; border-radius:8px; font-size:13px; }
  #loading { text-align:center; color:#888; padding:60px 20px; }
  #chooser { display:none; flex-direction:column; min-height:100vh; box-sizing:border-box; padding:20px 16px; gap:14px; background:white; }
  #chooser .logo { text-align:center; }
  #chooser .logo img { width:110px; height:110px; border-radius:24px; }
  #chooser h2 { text-align:center; font-size:28px; margin:4px 0 0 0; color:#0b3a9c; }
  #chooser p { text-align:center; font-size:17px; color:#555; margin:0 0 4px 0; }
  .role { flex:1; min-height:110px; border:none; border-radius:20px; color:white; font-size:28px; font-weight:bold; }
  .role small { display:block; font-size:16px; font-weight:normal; opacity:0.9; margin-top:6px; }
  .r-customer { background:#2e7d32; }
  .r-restaurant { background:#e65100; }
  .r-driver { background:#1565c0; }
  .r-admin { background:#4a148c; }
  #authBox { display:none; padding:20px; }
  #authBox h2 { text-align:center; color:#2e7d32; }
  #authBox input { width:100%; box-sizing:border-box; padding:12px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  #authSubmit { width:100%; padding:14px; border:none; border-radius:10px; background:#2e7d32; color:white; font-size:17px; font-weight:bold; }
  #authToggle { background:none; border:none; color:#2e7d32; font-size:15px; padding:14px; width:100%; }
  #authErr { color:#c62828; text-align:center; margin-top:8px; }
  #customerApp { display:none; }
  .sections { display:flex; gap:10px; padding:12px; }
  .sections button { flex:1; padding:14px; border:none; border-radius:10px; background:white; font-size:16px; font-weight:bold; }
  .sections button.active { background:#2e7d32; color:white; }
  .list { padding:12px; padding-bottom:90px; }
  .card { background:white; border-radius:12px; padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .card h3 { margin:0 0 4px 0; }
  .card small { color:#666; }
  .card .price { color:#2e7d32; font-weight:bold; margin-top:4px; }
  .card button { background:#2e7d32; color:white; border:none; padding:10px 16px; border-radius:8px; }
  .empty { text-align:center; color:#888; padding:30px; }
  #cartBar { position:fixed; bottom:0; left:0; right:0; background:#1b5e20; color:white; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; font-size:16px; gap:8px; }
  #cartBar button { background:white; color:#1b5e20; border:none; padding:10px 14px; border-radius:8px; font-weight:bold; }
  #cartPage, #trackPage { display:none; padding:12px; }
  .row { background:white; border-radius:10px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .row .qty button { width:32px; height:32px; border:none; border-radius:50%; background:#c8e6c9; font-size:18px; }
  .row .qty span { margin:0 10px; font-weight:bold; }
  #total { background:white; border-radius:10px; padding:14px; font-size:18px; font-weight:bold; margin:12px 0; }
  .field { width:100%; box-sizing:border-box; padding:12px; margin-bottom:8px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  #locBtn { width:100%; padding:12px; margin-bottom:8px; border:1px solid #2e7d32; border-radius:8px; background:white; color:#2e7d32; font-size:16px; font-weight:bold; }
  #locInfo { color:#2e7d32; margin-bottom:8px; font-size:14px; }
  #confirm { width:100%; padding:14px; border:none; border-radius:10px; background:#2e7d32; color:white; font-size:17px; font-weight:bold; }
  #confirm:disabled { background:#bbb; }
  .back { background:none; border:none; color:#2e7d32; font-size:16px; padding:8px; }
  .ord { background:white; border-radius:12px; padding:14px; margin-bottom:10px; }
  .ord h3 { margin:0 0 8px 0; }
  .ord .line { padding:3px 0; color:#444; }
  .st { display:inline-block; padding:4px 12px; border-radius:20px; font-size:14px; margin-bottom:8px; background:#e0e0e0; }
  .st-new { background:#ffe0b2; color:#e65100; }
  .st-cooking { background:#fff9c4; color:#f57f17; }
  .st-ready { background:#bbdefb; color:#1565c0; }
  .st-onway { background:#e1bee7; color:#6a1b9a; }
  .st-delivered { background:#c8e6c9; color:#2e7d32; }
</style>
  <link rel="stylesheet" href="premium.css">
</head>
<body>

<script>
(function() {
  var pages = { restaurant: 'restaurant.html', driver: 'driver.html', admin: 'admin.html' };
  var role = localStorage.getItem('sb_role');
  var forceChoose = location.search.indexOf('choose=1') !== -1;
  if (!forceChoose && role && pages[role]) { location.replace(pages[role]); }
})();
</script>

<header id="topHeader">
  <button id="logoutBtn">خروج</button>
  🚲 سيريا بايك
  <button id="roleBtn">تغيير الدور</button>
</header>

<div id="loading">جاري التحميل...</div>

<div id="chooser">
  <div class="logo"><img src="logo.png" alt="Sybike" onerror="this.style.display='none'"></div>
  <h2>مين أنت؟</h2>
  <p>اختار دورك، وبنتذكر اختيارك المرة الجاية</p>
  <button class="role r-customer" data-role="customer">🛒 أنا زبون<small>اطلب من المطاعم والمتاجر</small></button>
  <button class="role r-restaurant" data-role="restaurant">🍽️ أنا مطعم أو متجر<small>استقبل الطلبات وأدر منتجاتك</small></button>
  <button class="role r-driver" data-role="driver">🚲 أنا سائق<small>استلم الطلبات وأوصلها</small></button>
  <button class="role r-admin" data-role="admin">⚙️ أنا المدير<small>لوحة التحكم</small></button>
</div>

<div id="authBox">
  <h2 id="authTitle">تسجيل دخول الزبون</h2>
  <input id="aEmail" type="email" placeholder="الإيميل">
  <input id="aPass" type="password" placeholder="كلمة السر">
  <button id="authSubmit">دخول</button>
  <div id="authErr"></div>
  <button id="authToggle">ليس لديك حساب؟ سجل الآن</button>
</div>

<div id="customerApp">
  <div id="home">
    <div class="sections">
      <button id="b1" class="active" data-type="مطعم">مطاعم</button>
      <button id="b2" data-type="سوبر ماركت">سوبر ماركت</button>
    </div>
    <div class="list" id="list"></div>
    <div id="cartBar">
      <span id="cartInfo">السلة فارغة</span>
      <span>
        <button id="trackBtn">📦 طلباتي</button>
        <button id="openCartBtn">عرض السلة</button>
      </span>
    </div>
  </div>

  <div id="cartPage">
    <button class="back" id="backHome">→ رجوع</button>
    <h2>سلة الطلب</h2>
    <div id="cartItems"></div>
    <div id="total"></div>
    <input class="field" id="custName" placeholder="اسمك">
    <input class="field" id="custAddr" placeholder="عنوانك (المدينة - الحي - الشارع)">
    <button id="locBtn">📍 حدد موقعي</button>
    <div id="locInfo"></div>
    <button id="confirm">تأكيد الطلب</button>
  </div>

  <div id="trackPage">
    <button class="back" id="backHome2">→ رجوع للرئيسية</button>
    <h2>تتبع الطلب</h2>
    <div id="trackList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDh6GFQR5CzjnRLsrTS5FhWrHRZmLG5QSc",
  authDomain: "syria-bike.firebaseapp.com",
  projectId: "syria-bike",
  storageBucket: "syria-bike.firebasestorage.app",
  messagingSenderId: "417884008874",
  appId: "1:417884008874:web:f95dc7c3886c765b3bbbd3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const pages = { restaurant: 'restaurant.html', driver: 'driver.html', admin: 'admin.html' };
const STATES = { new:'تم استلام طلبك', cooking:'قيد التحضير', ready:'جاهز، بانتظار السائق', onway:'السائق بالطريق إليك', delivered:'تم التوصيل' };
const DELIVERY_FEE = 20000;

let products = [];
let loaded = false;
let cart = {};
let currentType = 'مطعم';
let currentUser = null;
let authReady = false;
let registerMode = false;
let loc = null;
let myOrders = [];
let ordersUnsub = null;
let productsStarted = false;

function $(id) { return document.getElementById(id); }
function fmt(x) { return Number(x).toLocaleString('ar-SY') + ' ل.س'; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function hideAll() {
  $('loading').style.display = 'none';
  $('chooser').style.display = 'none';
  $('authBox').style.display = 'none';
  $('customerApp').style.display = 'none';
  $('topHeader').style.display = 'none';
}

function showChooser() { hideAll(); $('chooser').style.display = 'flex'; }

function showAuth() {
  hideAll();
  $('topHeader').style.display = 'block';
  $('logoutBtn').style.display = 'none';
  $('authBox').style.display = 'block';
  renderAuthMode();
}

function showCustomer() {
  hideAll();
  $('topHeader').style.display = 'block';
  $('logoutBtn').style.display = 'block';
  $('customerApp').style.display = 'block';
  startProducts();
  showView('home');
  show(currentType);
}

function route() {
  const r = localStorage.getItem('sb_role');
  if (r !== 'customer') { showChooser(); return; }
  if (!authReady) return;
  if (currentUser) { showCustomer(); } else { showAuth(); }
}

function showView(name) {
  $('home').style.display = name === 'home' ? 'block' : 'none';
  $('cartPage').style.display = name === 'cart' ? 'block' : 'none';
  $('trackPage').style.display = name === 'track' ? 'block' : 'none';
  if (name === 'track') renderTrack();
  window.scrollTo(0, 0);
}

function renderAuthMode() {
  $('authTitle').textContent = registerMode ? 'إنشاء حساب جديد' : 'تسجيل دخول الزبون';
  $('authSubmit').textContent = registerMode ? 'إنشاء الحساب' : 'دخول';
  $('authToggle').textContent = registerMode ? 'عندك حساب؟ سجل دخولك' : 'ليس لديك حساب؟ سجل الآن';
  $('authErr').textContent = '';
}

async function doAuth() {
  const email = $('aEmail').value.trim();
  const pass = $('aPass').value;
  $('authErr').textContent = '';
  if (!email || !pass) { $('authErr').textContent = 'اكتب الإيميل وكلمة السر'; return; }
  try {
    if (registerMode) { await createUserWithEmailAndPassword(auth, email, pass); }
    else { await signInWithEmailAndPassword(auth, email, pass); }
  } catch (e) {
    const c = e && e.code ? e.code : '';
    let msg = 'صار خطأ، جرب مرة ثانية';
    if (c === 'auth/email-already-in-use') msg = 'هذا الإيميل مستخدم من قبل';
    else if (c === 'auth/weak-password') msg = 'كلمة السر ضعيفة (6 أحرف على الأقل)';
    else if (c === 'auth/invalid-email') msg = 'الإيميل غير صحيح';
    else if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found') msg = 'الإيميل أو كلمة السر غير صحيحة';
    $('authErr').textContent = msg;
  }
}

function startOrders(uid) {
  if (ordersUnsub) ordersUnsub();
  ordersUnsub = onSnapshot(query(collection(db, 'orders'), where('customerUid', '==', uid)), function(snap) {
    myOrders = snap.docs.map(function(d) { const o = d.data(); o.id = d.id; return o; });
    renderTrack();
  }, function(err) { console.error(err); });
}

function stopOrders() {
  if (ordersUnsub) ordersUnsub();
  ordersUnsub = null;
  myOrders = [];
}

onAuthStateChanged(auth, function(user) {
  currentUser = user;
  authReady = true;
  if (user) { startOrders(user.uid); } else { stopOrders(); }
  route();
});

function startProducts() {
  if (productsStarted) return;
  productsStarted = true;
  onSnapshot(collection(db, 'products'), function(snap) {
    products = snap.docs.map(function(d) { const p = d.data(); p.id = d.id; return p; });
    loaded = true;
    show(currentType);
    updateBar();
  }, function(err) {
    loaded = true;
    console.error(err);
    show(currentType);
  });
}

function show(type) {
  currentType = type;
  $('b1').className = type === 'مطعم' ? 'active' : '';
  $('b2').className = type === 'سوبر ماركت' ? 'active' : '';
  const list = products.filter(function(p) { return p.type === type; });
  if (!loaded) { $('list').innerHTML = '<div class="empty">جاري التحميل...</div>'; return; }
  if (list.length === 0) { $('list').innerHTML = '<div class="empty">لا يوجد منتجات حالياً، تابعنا قريباً</div>'; return; }
  $('list').innerHTML = list.map(function(i) {
    return '<div class="card"><div><h3>' + esc(i.n) + '</h3><small>' + esc(i.shop) + '</small>' +
      '<div class="price">' + fmt(i.p) + '</div></div>' +
      '<button class="addBtn" data-id="' + esc(i.id) + '">أضف</button></div>';
  }).join('');
}

function add(id) { cart[id] = (cart[id] || 0) + 1; updateBar(); }

function change(id, d) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] <= 0) delete cart[id];
  renderCart();
  updateBar();
}

function cartItems() { return products.filter(function(p) { return cart[p.id]; }); }

function totals() {
  let count = 0, sum = 0;
  cartItems().forEach(function(i) { count += cart[i.id]; sum += cart[i.id] * i.p; });
  return {count: count, sum: sum};
}

function updateBar() {
  const t = totals();
  $('cartInfo').textContent = t.count === 0 ? 'السلة فارغة' : t.count + ' عناصر · ' + fmt(t.sum);
}

function renderCart() {
  const rows = cartItems().map(function(i) {
    return '<div class="row"><div><b>' + esc(i.n) + '</b><br><small>' + esc(i.shop) + ' · ' + fmt(i.p) + '</small></div>' +
      '<div class="qty"><button class="chgBtn" data-id="' + esc(i.id) + '" data-d="1">+</button>' +
      '<span>' + cart[i.id] + '</span>' +
      '<button class="chgBtn" data-id="' + esc(i.id) + '" data-d="-1">−</button></div></div>';
  }).join('');
  $('cartItems').innerHTML = rows || '<p>السلة فارغة</p>';
  const t = totals();
  const fee = t.count ? DELIVERY_FEE : 0;
  $('total').innerHTML = 'المشتريات: ' + fmt(t.sum) + '<br>أجرة التوصيل: ' + fmt(fee) + '<br>المجموع: ' + fmt(t.sum + fee);
}

function locate() {
  if (!navigator.geolocation) { alert('جهازك ما بيدعم تحديد الموقع، اكتب العنوان يدوياً'); return; }
  $('locInfo').textContent = 'جاري تحديد موقعك...';
  navigator.geolocation.getCurrentPosition(function(pos) {
    loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    $('locInfo').textContent = '✅ تم تحديد موقعك';
  }, function() {
    loc = null;
    $('locInfo').textContent = '';
    alert('ما قدرنا نحدد موقعك، اكتب العنوان يدوياً');
  }, { enableHighAccuracy: true, timeout: 10000 });
}

function renderTrack() {
  const box = $('trackList');
  if (!myOrders.length) { box.innerHTML = '<div class="empty">لا يوجد طلبات بعد</div>'; return; }
  const list = myOrders.slice().sort(function(a, b) {
    const ta = a.createdAt ? a.createdAt.seconds : 9999999999;
    const tb = b.createdAt ? b.createdAt.seconds : 9999999999;
    return tb - ta;
  });
  box.innerHTML = list.map(function(o) {
    const shops = (o.shops || []).map(esc).join('، ');
    const drv = o.driver ? '<div class="line">🚲 السائق: ' + esc(o.driver) + '</div>' : '';
    return '<div class="ord"><span class="st st-' + esc(o.state) + '">' + esc(STATES[o.state] || o.state) + '</span>' +
      '<h3>طلب رقم ' + esc(o.id.slice(0, 6)) + '</h3>' +
      '<div class="line">🍽️ ' + shops + '</div>' +
      '<div class="line">💵 ' + fmt(o.total || 0) + '</div>' + drv + '</div>';
  }).join('');
}

async function confirmOrder() {
  if (!currentUser) { alert('سجّل دخولك أولاً'); return; }
  const name = $('custName').value.trim();
  const addr = $('custAddr').value.trim();
  if (totals().count === 0) { alert('السلة فارغة'); return; }
  if (!name || !addr) { alert('اكتب اسمك وعنوانك'); return; }

  const list = cartItems();
  const items = list.map(function(i) { return {n: i.n, shop: i.shop, q: cart[i.id], p: i.p}; });
  const shops = Array.from(new Set(list.map(function(i) { return i.shop; })));
  const sum = totals().sum;
  const order = {
    customer: name,
    address: addr,
    items: items,
    shops: shops,
    customerUid: currentUser.uid,
    subtotal: sum,
    deliveryFee: DELIVERY_FEE,
    total: sum + DELIVERY_FEE,
    state: 'new',
    createdAt: serverTimestamp()
  };
  if (loc) { order.lat = loc.lat; order.lng = loc.lng; }

  const btn = $('confirm');
  btn.disabled = true;
  try {
    const ref = await addDoc(collection(db, 'orders'), order);
    alert('تم استلام طلبك! رقم الطلب: ' + ref.id.slice(0, 6));
    cart = {};
    $('custName').value = '';
    $('custAddr').value = '';
    $('locInfo').textContent = '';
    loc = null;
    updateBar();
    showView('track');
  } catch (e) {
    alert('صار خطأ، جرب مرة ثانية');
    console.error(e);
  }
  btn.disabled = false;
}

document.addEventListener('click', function(e) {
  const t = e.target;
  const rb = t.closest('[data-role]');
  if (rb) {
    const r = rb.dataset.role;
    localStorage.setItem('sb_role', r);
    if (pages[r]) { location.href = pages[r]; } else { route(); }
    return;
  }
  if (t.id === 'roleBtn') { localStorage.removeItem('sb_role'); route(); return; }
  if (t.id === 'logoutBtn') { signOut(auth); return; }
  if (t.id === 'authSubmit') { doAuth(); return; }
  if (t.id === 'authToggle') { registerMode = !registerMode; renderAuthMode(); return; }
  if (t.dataset.type) { show(t.dataset.type); return; }
  if (t.classList.contains('addBtn')) { add(t.dataset.id); return; }
  if (t.classList.contains('chgBtn')) { change(t.dataset.id, Number(t.dataset.d)); return; }
  if (t.id === 'openCartBtn') { showView('cart'); renderCart(); return; }
  if (t.id === 'trackBtn') { showView('track'); return; }
  if (t.id === 'backHome' || t.id === 'backHome2') { showView('home'); return; }
  if (t.id === 'locBtn') { locate(); return; }
  if (t.id === 'confirm') { confirmOrder(); return; }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && $('authBox').style.display === 'block') { doAuth(); }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

if (localStorage.getItem('sb_role') !== 'customer') { route(); }
</script>
</body>
</html>
