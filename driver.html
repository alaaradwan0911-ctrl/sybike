<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سيريا بايك - السائق</title>
<link rel="manifest" href="manifest-driver.json">
<meta name="theme-color" content="#1565c0">
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#f4f4f4; }
  header { background:#1565c0; color:white; padding:16px; text-align:center; font-size:22px; font-weight:bold; }
  #loginBox { padding:20px; }
  #loginBox h2 { text-align:center; color:#1565c0; }
  #loginBox input { width:100%; box-sizing:border-box; padding:12px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  #loginBox button { width:100%; padding:14px; border:none; border-radius:10px; background:#1565c0; color:white; font-size:17px; font-weight:bold; }
  #loginErr { color:#c62828; text-align:center; margin-top:10px; }
  #app { display:none; }
  #logout { background:white; color:#1565c0; border:none; padding:8px 14px; border-radius:8px; font-weight:bold; margin:10px 12px 0 12px; }
  .me { padding:12px; }
  .me input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc; }
  .sub { margin:0 12px 8px 12px; padding:12px; border-radius:10px; text-align:center; font-weight:bold; }
  .sub.ok { background:#c8e6c9; color:#2e7d32; }
  .sub.bad { background:#ffcdd2; color:#c62828; }
  .stats { display:flex; gap:10px; padding:0 12px 12px 12px; }
  .stat { flex:1; background:white; border-radius:12px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:20px; color:#1565c0; margin-top:4px; }
  .order { background:white; border-radius:12px; padding:14px; margin:10px 12px; }
  .order h3 { margin:0 0 8px 0; }
  .line { padding:4px 0; color:#444; }
  .status { display:inline-block; padding:4px 12px; border-radius:20px; font-size:14px; margin-bottom:8px; }
  .ready { background:#bbdefb; color:#1565c0; }
  .onway { background:#fff9c4; color:#f57f17; }
  .order button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:8px; font-size:16px; font-weight:bold; color:white; background:#1565c0; }
  .order button.done { background:#2e7d32; }
  .order button:disabled { background:#bbb; }
  .empty { text-align:center; color:#888; padding:30px; }
</style>
</head>
<body>
<header>🚲 واجهة السائق</header>

<div id="loginBox">
  <h2>تسجيل دخول السائق</h2>
  <input id="email" type="email" placeholder="الإيميل">
  <input id="pass" type="password" placeholder="كلمة السر">
  <button id="loginBtn">دخول</button>
  <div id="loginErr"></div>
</div>

<div id="app">
  <button id="logout">خروج</button>
  <div class="me">
    <input id="driverName" placeholder="اكتب اسمك هنا (مثلاً: أحمد)">
  </div>
  <div id="subBar"></div>
  <div class="stats">
    <div class="stat">توصيلاتك<b id="count">0</b></div>
    <div class="stat">أرباحك<b id="earn">0</b></div>
  </div>
  <div id="orders"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDh6GFQR5CzjnRLsrTS5FhWrHRZmLG5QSc",
  authDomain: "syria-bike.firebaseapp.com",
  projectId: "syria-bike",
  storageBucket: "syria-bike.firebasestorage.app",
  messagingSenderId: "417884008874",
  appId: "1:417884008874:web:f95dc7c3886c765b3bbbd3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const labels = {ready:'جاهز للاستلام', onway:'في الطريق للزبون'};
let allOrders = [];
let members = [];
let started = false;

function fmt(x) { return x.toLocaleString('ar-SY') + ' ل.س'; }

function startListening() {
  if (started) return;
  started = true;
  onSnapshot(collection(db, 'orders'), function(snap) {
    allOrders = snap.docs.map(function(d) { const o = d.data(); o.id = d.id; return o; });
    render();
  });
  onSnapshot(collection(db, 'members'), function(snap) {
    members = snap.docs.map(function(d) { const m = d.data(); m.id = d.id; return m; });
    render();
  });
}

onAuthStateChanged(auth, function(user) {
  if (user) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    startListening();
  } else {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
});

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  document.getElementById('loginErr').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    document.getElementById('loginErr').textContent = 'الإيميل أو كلمة السر غير صحيحة';
  }
}

function driverSub(name) {
  const m = members.find(function(x) { return x.type === 'driver' && x.name === name; });
  return { member: m, ok: !!(m && m.paidUntil && m.paidUntil > Date.now()) };
}

function render() {
  const me = document.getElementById('driverName').value.trim();
  const sub = driverSub(me);

  if (!me) {
    document.getElementById('subBar').innerHTML = '';
  } else if (sub.ok) {
    document.getElementById('subBar').innerHTML =
      '<div class="sub ok">✅ اشتراكك مفعّل حتى ' + new Date(sub.member.paidUntil).toLocaleDateString('ar-SY') + '</div>';
  } else if (sub.member && sub.member.paidUntil) {
    document.getElementById('subBar').innerHTML =
      '<div class="sub bad">⚠️ اشتراكك منتهي. تواصل مع الإدارة لتجديده (5 دولار بالشهر)</div>';
  } else {
    document.getElementById('subBar').innerHTML =
      '<div class="sub bad">⚠️ اشتراكك غير مفعّل أو اسمك غير مسجّل. تواصل مع الإدارة (5 دولار بالشهر)</div>';
  }

  const mineDone = allOrders.filter(function(o) {
    return o.state === 'delivered' && me && o.driver === me;
  });
  document.getElementById('count').textContent = mineDone.length;
  document.getElementById('earn').textContent = fmt(mineDone.reduce(function(s, o) { return s + (o.deliveryFee || 0); }, 0));

  const list = allOrders.filter(function(o) {
    if (o.state === 'ready') return true;
    if (o.state === 'onway' && me && o.driver === me) return true;
    return false;
  });

  if (list.length === 0) {
    document.getElementById('orders').innerHTML = '<div class="empty">لا يوجد طلبات حالياً</div>';
    return;
  }

  document.getElementById('orders').innerHTML = list.map(function(o) {
    const shops = Array.from(new Set(o.items.map(function(i) { return i.shop; }))).join('، ');
    let btn;
    if (o.state === 'ready') {
      btn = '<button class="act" ' + (sub.ok ? '' : 'disabled') + ' data-id="' + o.id + '" data-s="onway">' +
        (sub.ok ? 'استلمت الطلب' : 'الاشتراك غير مفعّل') + '</button>';
    } else {
      btn = '<button class="act done" data-id="' + o.id + '" data-s="delivered">تم التوصيل</button>';
    }
    return '<div class="order"><span class="status ' + o.state + '">' + labels[o.state] + '</span>' +
      '<h3>طلب رقم ' + o.id.slice(0, 6) + '</h3>' +
      '<div class="line">🍽️ من: ' + shops + '</div>' +
      '<div class="line">👤 الزبون: ' + o.customer + '</div>' +
      '<div class="line">📍 إلى: ' + o.address + '</div>' +
      '<div class="line">💵 المبلغ المطلوب من الزبون: ' + fmt(o.total) + '</div>' +
      '<div class="line">🚲 أجرتك من هذا الطلب: ' + fmt(o.deliveryFee || 0) + '</div>' + btn + '</div>';
  }).join('');
}

document.getElementById('driverName').addEventListener('input', render);

document.addEventListener('click', async function(e) {
  const t = e.target;
  if (t.id === 'loginBtn') { doLogin(); return; }
  if (t.id === 'logout') { signOut(auth); return; }
  if (!t.classList.contains('act') || t.disabled) return;
  const me = document.getElementById('driverName').value.trim();
  if (!me) { alert('اكتب اسمك بالخانة فوق أولاً'); return; }
  const data = { state: t.dataset.s };
  if (t.dataset.s === 'onway') data.driver = me;
  await updateDoc(doc(db, 'orders', t.dataset.id), data);
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('loginBox').style.display !== 'none') { doLogin(); }
});
</script>
</body>
</html>
