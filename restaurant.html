<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سيريا بايك - المطعم</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<meta name="theme-color" content="#e65100">
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#f4f4f4; padding-bottom:20px; }
  header { background:#e65100; color:white; padding:16px; text-align:center; font-size:22px; font-weight:bold; }
  #loginBox { padding:20px; }
  #loginBox h2 { text-align:center; color:#e65100; }
  #loginBox input { width:100%; box-sizing:border-box; padding:12px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  #loginBox button { width:100%; padding:14px; border:none; border-radius:10px; background:#e65100; color:white; font-size:17px; font-weight:bold; }
  #loginErr { color:#c62828; text-align:center; margin-top:10px; }
  #app { display:none; }
  .topBtns { display:flex; gap:8px; margin:10px 12px 0 12px; }
  .topBtns button { background:white; color:#e65100; border:none; padding:8px 14px; border-radius:8px; font-weight:bold; }
  .shopName { text-align:center; font-size:20px; font-weight:bold; padding:10px; color:#e65100; }
  .sub { margin:0 12px 8px 12px; padding:12px; border-radius:10px; text-align:center; font-weight:bold; }
  .sub.ok { background:#c8e6c9; color:#2e7d32; }
  .sub.bad { background:#ffcdd2; color:#c62828; }
  .tabs { display:flex; gap:8px; padding:0 12px 8px 12px; }
  .tabs button { flex:1; padding:12px; border:none; border-radius:10px; background:white; font-size:16px; font-weight:bold; }
  .tabs button.active { background:#e65100; color:white; }
  .info { padding:0 12px 6px 12px; color:#555; text-align:center; }
  .order { background:white; border-radius:12px; padding:14px; margin:10px 12px; }
  .order h3 { margin:0 0 8px 0; }
  .item { padding:4px 0; font-size:17px; }
  .addr { color:#666; margin:10px 0; padding-top:8px; border-top:1px solid #eee; }
  .status { display:inline-block; padding:4px 12px; border-radius:20px; font-size:14px; margin-bottom:8px; }
  .new { background:#ffe0b2; color:#e65100; }
  .cooking { background:#fff9c4; color:#f57f17; }
  .order button { width:100%; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:bold; color:white; background:#e65100; }
  .order button.done { background:#2e7d32; }
  .order button:disabled { background:#bbb; }
  .add { background:white; border-radius:12px; padding:14px; margin:10px 12px; }
  .add input, .add select { width:100%; box-sizing:border-box; padding:12px; margin-bottom:8px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  .add button { width:100%; padding:12px; border:none; border-radius:8px; background:#e65100; color:white; font-size:16px; font-weight:bold; }
  .prod { background:white; border-radius:12px; padding:14px; margin:10px 12px; }
  .prod h3 { margin:0 0 4px 0; }
  .prod .price { color:#e65100; font-weight:bold; }
  .btn { padding:10px 14px; border:none; border-radius:8px; color:white; font-size:15px; margin-top:8px; margin-left:6px; }
  .edit { background:#1565c0; }
  .del { background:#c62828; }
  .empty { text-align:center; color:#888; padding:30px; }
</style>
</head>
<body>
<header>🍽️ واجهة المطعم</header>

<div id="loginBox">
  <h2>تسجيل دخول المطعم</h2>
  <input id="email" type="email" placeholder="الإيميل">
  <input id="pass" type="password" placeholder="كلمة السر">
  <button id="loginBtn">دخول</button>
  <div id="loginErr"></div>
</div>

<div id="app">
  <div class="topBtns">
    <button id="logout">خروج</button>
    <button id="changeRole">تغيير الدور</button>
  </div>
  <div class="shopName" id="shopName"></div>
  <div id="subBar"></div>
  <div class="tabs">
    <button id="t1" class="active" data-tab="1">الطلبات</button>
    <button id="t2" data-tab="2">المنتجات</button>
  </div>

  <div id="ordersView">
    <div class="info" id="info"></div>
    <div id="ordersList"></div>
  </div>

  <div id="productsView" style="display:none">
    <div class="add">
      <b id="formTitle">إضافة منتج جديد</b><br><br>
      <input id="pName" placeholder="اسم المنتج">
      <input id="pPrice" type="number" inputmode="numeric" placeholder="السعر بالليرة">
      <select id="pType"><option value="مطعم">مطعم</option><option value="سوبر ماركت">سوبر ماركت</option></select>
      <button id="saveProd">إضافة</button>
      <button id="cancelProd" style="display:none;background:#888;margin-top:8px">إلغاء التعديل</button>
    </div>
    <div id="prodList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDh6GFQR5CzjnRLsrTS5FhWrHRZmLG5QSc",
  authDomain: "syria-bike.firebaseapp.com",
  projectId: "syria-bike",
  storageBucket: "syria-bike.firebasestorage.app",
  messagingSenderId: "417884008874",
  appId: "1:417884008874:web:f95dc7c3886c765b3bbbd3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const labels = {new:'طلب جديد', cooking:'قيد التحضير'};
let myEmail = '';
let member = null;
let shopOrders = [];
let myProducts = [];
let unsubs = [];
let shopUnsubs = [];
let current = 1;
let editId = null;

function $(id) { return document.getElementById(id); }
function fmt(x) { return Number(x).toLocaleString('ar-SY') + ' ل.س'; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function validShop() { return member && member.type === 'shop'; }
function subOk() { return !!(member && member.paidUntil && member.paidUntil > Date.now()); }

function stopShop() {
  shopUnsubs.forEach(function(f) { f(); });
  shopUnsubs = [];
  shopOrders = [];
  myProducts = [];
}

function stopAll() {
  unsubs.forEach(function(f) { f(); });
  unsubs = [];
  stopShop();
  member = null;
}

function startShop(name) {
  stopShop();
  shopUnsubs.push(onSnapshot(query(collection(db, 'orders'), where('shops', 'array-contains', name)), function(snap) {
    shopOrders = snap.docs.map(function(d) { const o = d.data(); o.id = d.id; return o; });
    renderOrders();
  }, function(err) { console.error(err); }));
  shopUnsubs.push(onSnapshot(query(collection(db, 'products'), where('ownerEmail', '==', myEmail)), function(snap) {
    myProducts = snap.docs.map(function(d) { const p = d.data(); p.id = d.id; return p; });
    renderProducts();
  }, function(err) { console.error(err); }));
}

function listenMember() {
  unsubs.push(onSnapshot(doc(db, 'members', myEmail), function(snap) {
    const oldName = validShop() ? member.name : null;
    member = snap.exists() ? snap.data() : null;
    if (validShop()) {
      if (member.name !== oldName) startShop(member.name);
    } else {
      stopShop();
    }
    render();
  }, function(err) { console.error(err); member = null; render(); }));
}

onAuthStateChanged(auth, function(user) {
  stopAll();
  if (user) {
    myEmail = (user.email || '').toLowerCase();
    $('loginBox').style.display = 'none';
    $('app').style.display = 'block';
    listenMember();
    render();
  } else {
    myEmail = '';
    $('loginBox').style.display = 'block';
    $('app').style.display = 'none';
  }
});

async function doLogin() {
  const email = $('email').value.trim();
  const pass = $('pass').value;
  $('loginErr').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    $('loginErr').textContent = 'الإيميل أو كلمة السر غير صحيحة';
  }
}

function render() {
  $('t1').className = current === 1 ? 'active' : '';
  $('t2').className = current === 2 ? 'active' : '';
  $('ordersView').style.display = current === 1 ? 'block' : 'none';
  $('productsView').style.display = current === 2 ? 'block' : 'none';

  if (!validShop()) {
    $('shopName').textContent = '';
    $('subBar').innerHTML = '<div class="sub bad">⚠️ هذا الإيميل غير مربوط بأي محل. تواصل مع الإدارة.</div>';
    $('info').textContent = '';
    $('ordersList').innerHTML = '';
    $('prodList').innerHTML = '';
    return;
  }

  $('shopName').textContent = member.name;
  if (subOk()) {
    $('subBar').innerHTML = '<div class="sub ok">✅ اشتراكك مفعّل حتى ' + new Date(member.paidUntil).toLocaleDateString('ar-SY') + '</div>';
  } else if (member.paidUntil) {
    $('subBar').innerHTML = '<div class="sub bad">⚠️ اشتراكك منتهي. تواصل مع الإدارة لتجديده (10 دولار بالشهر)</div>';
  } else {
    $('subBar').innerHTML = '<div class="sub bad">⚠️ اشتراكك غير مفعّل. تواصل مع الإدارة لتفعيله (10 دولار بالشهر)</div>';
  }
  renderOrders();
  renderProducts();
}

function renderOrders() {
  if (!validShop()) return;
  const shop = member.name;
  const ok = subOk();
  const mine = shopOrders.filter(function(o) { return o.state === 'new' || o.state === 'cooking'; });
  mine.sort(function(a, b) {
    const ta = a.createdAt ? a.createdAt.seconds : 9999999999;
    const tb = b.createdAt ? b.createdAt.seconds : 9999999999;
    return ta - tb;
  });
  $('info').textContent = 'عدد الطلبات الحالية: ' + mine.length;
  if (mine.length === 0) { $('ordersList').innerHTML = '<div class="empty">لا يوجد طلبات حالياً</div>'; return; }

  $('ordersList').innerHTML = mine.map(function(o) {
    const items = (o.items || []).filter(function(i) { return i.shop === shop; })
      .map(function(i) { return '<div class="item">• ' + esc(i.n) + ' × ' + esc(i.q) + '</div>'; }).join('');
    let btn;
    if (o.state === 'new') {
      btn = '<button class="act" ' + (ok ? '' : 'disabled') + ' data-id="' + esc(o.id) + '" data-s="cooking">' +
        (ok ? 'قبول الطلب' : 'الاشتراك غير مفعّل') + '</button>';
    } else {
      btn = '<button class="act done" data-id="' + esc(o.id) + '" data-s="ready">جاهز للتسليم</button>';
    }
    return '<div class="order"><span class="status ' + esc(o.state) + '">' + esc(labels[o.state]) + '</span>' +
      '<h3>طلب رقم ' + esc(o.id.slice(0, 6)) + '</h3>' + items +
      '<div class="addr">📍 ' + esc(o.address) + '</div>' + btn + '</div>';
  }).join('');
}

function renderProducts() {
  if (!validShop()) return;
  if (myProducts.length === 0) { $('prodList').innerHTML = '<div class="empty">لا يوجد منتجات بعد. أضف أول منتج.</div>'; return; }
  $('prodList').innerHTML = myProducts.map(function(p) {
    return '<div class="prod"><h3>' + esc(p.n) + '</h3><div class="price">' + fmt(p.p) + '</div>' +
      '<div style="color:#666">' + esc(p.type) + '</div>' +
      '<button class="btn edit" data-act="edit" data-id="' + esc(p.id) + '">تعديل</button>' +
      '<button class="btn del" data-act="del" data-id="' + esc(p.id) + '">حذف</button></div>';
  }).join('');
}

function resetForm() {
  editId = null;
  $('pName').value = '';
  $('pPrice').value = '';
  $('pType').value = 'مطعم';
  $('formTitle').textContent = 'إضافة منتج جديد';
  $('saveProd').textContent = 'إضافة';
  $('cancelProd').style.display = 'none';
}

document.addEventListener('click', async function(e) {
  const t = e.target;
  if (t.id === 'loginBtn') { doLogin(); return; }
  if (t.id === 'logout') { signOut(auth); return; }
  if (t.id === 'changeRole') { localStorage.removeItem('sb_role'); location.href = 'index.html?choose=1'; return; }
  if (t.dataset.tab) { current = Number(t.dataset.tab); render(); return; }

  if (t.classList.contains('act') && !t.disabled) {
    try {
      await updateDoc(doc(db, 'orders', t.dataset.id), { state: t.dataset.s });
    } catch (err) {
      alert('صار خطأ، جرب مرة ثانية');
      console.error(err);
    }
    return;
  }

  if (t.id === 'cancelProd') { resetForm(); return; }

  if (t.id === 'saveProd') {
    if (!validShop()) return;
    const n = $('pName').value.trim();
    const p = Number($('pPrice').value);
    const type = $('pType').value;
    if (!n || !(p > 0)) { alert('اكتب اسم المنتج وسعراً صحيحاً'); return; }
    try {
      if (editId) {
        await updateDoc(doc(db, 'products', editId), { n: n, p: p, type: type, shop: member.name, ownerEmail: myEmail });
      } else {
        await addDoc(collection(db, 'products'), { n: n, p: p, type: type, shop: member.name, ownerEmail: myEmail });
      }
      resetForm();
    } catch (err) {
      alert('صار خطأ، جرب مرة ثانية');
      console.error(err);
    }
    return;
  }

  const act = t.dataset.act;
  if (act === 'edit') {
    const p = myProducts.find(function(x) { return x.id === t.dataset.id; });
    if (!p) return;
    editId = p.id;
    $('pName').value = p.n;
    $('pPrice').value = p.p;
    $('pType').value = p.type;
    $('formTitle').textContent = 'تعديل المنتج';
    $('saveProd').textContent = 'حفظ التعديل';
    $('cancelProd').style.display = 'block';
    window.scrollTo(0, 0);
  }
  if (act === 'del' && confirm('حذف هذا المنتج؟')) {
    try {
      await deleteDoc(doc(db, 'products', t.dataset.id));
    } catch (err) {
      alert('صار خطأ، جرب مرة ثانية');
      console.error(err);
    }
  }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && $('loginBox').style.display !== 'none') { doLogin(); }
});
</script>
</body>
</html>
