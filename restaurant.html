<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سيريا بايك - المطعم</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e65100">
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#f4f4f4; padding-bottom:20px; }
  header { background:#e65100; color:white; padding:16px; text-align:center; font-size:22px; font-weight:bold; }
  #loginBox { padding:20px; }
  #loginBox h2 { text-align:center; color:#e65100; }
  #loginBox input { width:100%; box-sizing:border-box; padding:12px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  #loginBox button { width:100%; padding:14px; border:none; border-radius:10px; background:#e65100; color:white; font-size:17px; font-weight:bold; }
  #loginErr { color:#c62828; text-align:center; margin-top:10px; }
  #app { display:none; }
  #logout { background:white; color:#e65100; border:none; padding:8px 14px; border-radius:8px; font-weight:bold; margin:10px 12px 0 12px; }
  .shopName { text-align:center; font-size:20px; font-weight:bold; padding:10px; color:#e65100; }
  .sub { margin:0 12px 8px 12px; padding:12px; border-radius:10px; text-align:center; font-weight:bold; }
  .sub.ok { background:#c8e6c9; color:#2e7d32; }
  .sub.bad { background:#ffcdd2; color:#c62828; }
  .tabs { display:flex; gap:8px; padding:0 12px 8px 12px; }
  .tabs button { flex:1; padding:12px; border:none; border-radius:10px; background:white; font-size:16px; font-weight:bold; }
  .tabs button.active { background:#e65100; color:white; }
  .info { padding:0 12px 6px 12px; color:#555; text-align:center; }
  .order { background:white; border-radius:12px; padding:14px; margin:10px 12px; }
  .order h3 { margin:0 0 8px 0; }
  .item { padding:4px 0; font-size:17px; }
  .addr { color:#666; margin:10px 0; padding-top:8px; border-top:1px solid #eee; }
  .status { display:inline-block; padding:4px 12px; border-radius:20px; font-size:14px; margin-bottom:8px; }
  .new { background:#ffe0b2; color:#e65100; }
  .cooking { background:#fff9c4; color:#f57f17; }
  .order button { width:100%; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:bold; color:white; background:#e65100; }
  .order button.done { background:#2e7d32; }
  .order button:disabled { background:#bbb; }
  .add { background:white; border-radius:12px; padding:14px; margin:10px 12px; }
  .add input { width:100%; box-sizing:border-box; padding:12px; margin-bottom:8px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  .add button { width:100%; padding:12px; border:none; border-radius:8px; background:#e65100; color:white; font-size:16px; font-weight:bold; }
  .prod { background:white; border-radius:12px; padding:14px; margin:10px 12px; }
  .prod h3 { margin:0 0 4px 0; }
  .prod .price { color:#e65100; font-weight:bold; }
  .btn { padding:10px 14px; border:none; border-radius:8px; color:white; font-size:15px; margin-top:8px; margin-left:6px; }
  .edit { background:#1565c0; }
  .del { background:#c62828; }
  .empty { text-align:center; color:#888; padding:30px; }
</style>
</head>
<body>
<header>🍽️ واجهة المطعم</header>

<div id="loginBox">
  <h2>تسجيل دخول المطعم</h2>
  <input id="email" type="email" placeholder="الإيميل">
  <input id="pass" type="password" placeholder="كلمة السر">
  <button id="loginBtn">دخول</button>
  <div id="loginErr"></div>
</div>

<div id="app">
    <button id="logout">خروج</button>
  <button id="changeRole" style="background:white;color:#e65100;border:none;padding:8px 14px;border-radius:8px;font-weight:bold;margin:10px 0 0 12px;">تغيير الدور</button>
  <div class="shopName" id="shopName"></div>
  <div id="subBar"></div>
  <div class="tabs">
    <button id="t1" class="active" data-tab="1">الطلبات</button>
    <button id="t2" data-tab="2">المنتجات</button>
  </div>
  <div id="content"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDh6GFQR5CzjnRLsrTS5FhWrHRZmLG5QSc",
  authDomain: "syria-bike.firebaseapp.com",
  projectId: "syria-bike",
  storageBucket: "syria-bike.firebasestorage.app",
  messagingSenderId: "417884008874",
  appId: "1:417884008874:web:f95dc7c3886c765b3bbbd3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const labels = {new:'طلب جديد', cooking:'قيد التحضير'};
let allOrders = [];
let members = [];
let products = [];
let myEmail = '';
let current = 1;
let editId = null;
let started = false;

function fmt(x) { return Number(x).toLocaleString('ar-SY') + ' ل.س'; }

function myShop() {
  return members.find(function(m) {
    return m.type === 'shop' && m.email && m.email.toLowerCase() === myEmail;
  });
}

function startListening() {
  if (started) return;
  started = true;
  onSnapshot(collection(db, 'orders'), function(snap) {
    allOrders = snap.docs.map(function(d) { const o = d.data(); o.id = d.id; return o; });
    render();
  });
  onSnapshot(collection(db, 'members'), function(snap) {
    members = snap.docs.map(function(d) { const m = d.data(); m.id = d.id; return m; });
    render();
  });
  onSnapshot(collection(db, 'products'), function(snap) {
    products = snap.docs.map(function(d) { const p = d.data(); p.id = d.id; return p; });
    render();
  });
}

onAuthStateChanged(auth, function(user) {
  if (user) {
    myEmail = (user.email || '').toLowerCase();
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    startListening();
    render();
  } else {
    myEmail = '';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
});

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  document.getElementById('loginErr').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    document.getElementById('loginErr').textContent = 'الإيميل أو كلمة السر غير صحيحة';
  }
}

function render() {
  document.getElementById('t1').className = current === 1 ? 'active' : '';
  document.getElementById('t2').className = current === 2 ? 'active' : '';
  const shopRec = myShop();
  const content = document.getElementById('content');

  if (!shopRec) {
    document.getElementById('shopName').textContent = '';
    document.getElementById('subBar').innerHTML =
      '<div class="sub bad">⚠️ هذا الإيميل غير مربوط بأي محل. تواصل مع الإدارة.</div>';
    content.innerHTML = '';
    return;
  }

  const shop = shopRec.name;
  const ok = !!(shopRec.paidUntil && shopRec.paidUntil > Date.now());
  document.getElementById('shopName').textContent = shop;

  if (ok) {
    document.getElementById('subBar').innerHTML =
      '<div class="sub ok">✅ اشتراكك مفعّل حتى ' + new Date(shopRec.paidUntil).toLocaleDateString('ar-SY') + '</div>';
  } else if (shopRec.paidUntil) {
    document.getElementById('subBar').innerHTML =
      '<div class="sub bad">⚠️ اشتراكك منتهي. تواصل مع الإدارة لتجديده (10 دولار بالشهر)</div>';
  } else {
    document.getElementById('subBar').innerHTML =
      '<div class="sub bad">⚠️ اشتراكك غير مفعّل. تواصل مع الإدارة لتفعيله (10 دولار بالشهر)</div>';
  }

  if (current === 1) { renderOrders(shop, ok); } else { renderProducts(shop); }
}

function renderOrders(shop, ok) {
  const content = document.getElementById('content');
  const mine = allOrders.filter(function(o) {
    return (o.state === 'new' || o.state === 'cooking') &&
      o.items.some(function(i) { return i.shop === shop; });
  });
  let html = '<div class="info">عدد الطلبات الحالية: ' + mine.length + '</div>';
  if (mine.length === 0) {
    content.innerHTML = html + '<div class="empty">لا يوجد طلبات حالياً</div>';
    return;
  }
  html += mine.map(function(o) {
    const items = o.items.filter(function(i) { return i.shop === shop; })
      .map(function(i) { return '<div class="item">• ' + i.n + ' × ' + i.q + '</div>'; }).join('');
    let btn;
    if (o.state === 'new') {
      btn = '<button class="act" ' + (ok ? '' : 'disabled') + ' data-id="' + o.id + '" data-s="cooking">' +
        (ok ? 'قبول الطلب' : 'الاشتراك غير مفعّل') + '</button>';
    } else {
      btn = '<button class="act done" data-id="' + o.id + '" data-s="ready">جاهز للتسليم</button>';
    }
    return '<div class="order"><span class="status ' + o.state + '">' + labels[o.state] + '</span>' +
      '<h3>طلب رقم ' + o.id.slice(0, 6) + '</h3>' + items +
      '<div class="addr">📍 ' + o.address + '</div>' + btn + '</div>';
  }).join('');
  content.innerHTML = html;
}

function renderProducts(shop) {
  const content = document.getElementById('content');
  const mine = products.filter(function(p) { return p.ownerEmail === myEmail; });
  const editing = editId ? mine.find(function(p) { return p.id === editId; }) : null;

  let html = '<div class="add"><b>' + (editing ? 'تعديل المنتج' : 'إضافة منتج جديد') + '</b><br><br>' +
    '<input id="pName" placeholder="اسم المنتج" value="' + (editing ? editing.n.replace(/"/g, '&quot;') : '') + '">' +
    '<input id="pPrice" type="number" inputmode="numeric" placeholder="السعر بالليرة" value="' + (editing ? editing.p : '') + '">' +
    '<input id="pType" placeholder="النوع: مطعم أو سوبر ماركت" value="' + (editing ? editing.type : 'مطعم') + '">' +
    '<button data-act="save">' + (editing ? 'حفظ التعديل' : 'إضافة') + '</button>' +
    (editing ? '<button data-act="cancel" style="background:#888;margin-top:8px">إلغاء</button>' : '') +
    '</div>';

  if (mine.length === 0) {
    html += '<div class="empty">لا يوجد منتجات بعد. أضف أول منتج.</div>';
  } else {
    html += mine.map(function(p) {
      return '<div class="prod"><h3>' + p.n + '</h3><div class="price">' + fmt(p.p) + '</div>' +
        '<div style="color:#666">' + p.type + '</div>' +
        '<button class="btn edit" data-act="edit" data-id="' + p.id + '">تعديل</button>' +
        '<button class="btn del" data-act="del" data-id="' + p.id + '">حذف</button></div>';
    }).join('');
  }
  content.innerHTML = html;
}

document.addEventListener('click', async function(e) {
  const t = e.target;
  if (t.id === 'loginBtn') { doLogin(); return; }
  if (t.id === 'logout') { signOut(auth); return; }
  if (t.dataset.tab) { current = Number(t.dataset.tab); editId = null; render(); return; }

  if (t.classList.contains('act') && !t.disabled) {
    await updateDoc(doc(db, 'orders', t.dataset.id), { state: t.dataset.s });
    return;
  }

  const act = t.dataset.act;
  if (!act) return;
  const shopRec = myShop();
  if (!shopRec) return;

  if (act === 'save') {
    const n = document.getElementById('pName').value.trim();
    const p = Number(document.getElementById('pPrice').value);
    let type = document.getElementById('pType').value.trim();
    if (!n || !p || p <= 0) { alert('اكتب اسم المنتج وسعراً صحيحاً'); return; }
    if (type !== 'سوبر ماركت') type = 'مطعم';
    try {
      if (editId) {
        await updateDoc(doc(db, 'products', editId), { n: n, p: p, type: type });
        editId = null;
      } else {
        await addDoc(collection(db, 'products'), {
          n: n, p: p, type: type, shop: shopRec.name, ownerEmail: myEmail
        });
      }
    } catch (err) {
      alert('صار خطأ، جرب مرة ثانية');
      console.error(err);
    }
  }
  if (act === 'edit') { editId = t.dataset.id; render(); }
  if (act === 'cancel') { editId = null; render(); }
  if (act === 'del' && confirm('حذف هذا المنتج؟')) {
    try { await deleteDoc(doc(db, 'products', t.dataset.id)); }
    catch (err) { alert('صار خطأ، جرب مرة ثانية'); console.error(err); }
  }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('loginBox').style.display !== 'none') { doLogin(); }
});
</script>
</body>
</html>
