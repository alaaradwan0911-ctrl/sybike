<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syria Bike Command Center</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a148c">
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#f4f4f4; padding-bottom:20px; }
  header { background:#4a148c; color:white; padding:16px; text-align:center; font-size:22px; font-weight:bold; }
  #loginBox { padding:20px; }
  #loginBox h2 { text-align:center; color:#4a148c; }
  #loginBox input { width:100%; box-sizing:border-box; padding:12px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  #loginBox button { width:100%; padding:14px; border:none; border-radius:10px; background:#4a148c; color:white; font-size:17px; font-weight:bold; }
  #loginErr { color:#c62828; text-align:center; margin-top:10px; }
  #app { display:none; }
  .topBtns { display:flex; gap:8px; margin:10px 12px 0 12px; }
  .topBtns button { background:white; color:#4a148c; border:none; padding:8px 14px; border-radius:8px; font-weight:bold; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; padding:12px; }
  .stat { flex:1 1 40%; background:white; border-radius:12px; padding:10px; text-align:center; font-size:14px; }
  .stat b { display:block; font-size:18px; color:#4a148c; margin-top:4px; }
  .tabs { display:flex; gap:8px; padding:0 12px; }
  .tabs button { flex:1; padding:12px; border:none; border-radius:10px; background:white; font-size:16px; font-weight:bold; }
  .tabs button.active { background:#4a148c; color:white; }
  .box { padding:12px; }
  .card { background:white; border-radius:12px; padding:14px; margin-bottom:10px; }
  .card h3 { margin:0 0 6px 0; }
  .line { padding:3px 0; color:#444; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:13px; margin-bottom:6px; }
  .new { background:#ffe0b2; color:#e65100; }
  .cooking { background:#fff9c4; color:#f57f17; }
  .ready { background:#bbdefb; color:#1565c0; }
  .onway { background:#e1bee7; color:#6a1b9a; }
  .delivered { background:#c8e6c9; color:#2e7d32; }
  .active-sub { background:#c8e6c9; color:#2e7d32; }
  .expired-sub { background:#ffcdd2; color:#c62828; }
  .add { background:white; border-radius:12px; padding:14px; margin-bottom:12px; }
  .add input, .add select { width:100%; box-sizing:border-box; padding:12px; margin-bottom:8px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  .add button { width:100%; padding:12px; border:none; border-radius:8px; background:#4a148c; color:white; font-size:16px; font-weight:bold; }
  .btn { padding:10px 14px; border:none; border-radius:8px; color:white; font-size:15px; margin-top:6px; margin-left:6px; }
  .pay { background:#2e7d32; }
  .mail { background:#1565c0; }
  .del { background:#c62828; }
  .empty { text-align:center; color:#888; padding:30px; }
</style>
</head>
<body>
<header>⚙️ Syria Bike Command Center</header>

<div id="loginBox">
  <h2>تسجيل دخول المدير</h2>
  <input id="email" type="email" placeholder="الإيميل">
  <input id="pass" type="password" placeholder="كلمة السر">
  <button id="loginBtn">دخول</button>
  <div id="loginErr"></div>
</div>

<div id="app">
  <div class="topBtns">
    <button id="logout">خروج</button>
    <button id="changeRole">تغيير الدور</button>
  </div>
  <div class="stats">
    <div class="stat">كل الطلبات<b id="sOrders">0</b></div>
    <div class="stat">قيد التنفيذ<b id="sActive">0</b></div>
    <div class="stat">المبيعات المسلّمة<b id="sSales">0</b></div>
    <div class="stat">اشتراكات مفعّلة<b id="sSubs">0</b></div>
    <div class="stat">دخلكم من الاشتراكات المفعّلة<b id="sIncome">0</b></div>
  </div>
  <div class="tabs">
    <button id="t1" class="active" data-tab="1">الطلبات</button>
    <button id="t2" data-tab="2">المحلات والسائقين</button>
  </div>
  <div class="box">
    <div id="addBox" style="display:none">
      <div class="add">
        <input id="nm" placeholder="الاسم (مطابق لما بدك الزبون يشوفه للمحلات)">
        <input id="em" type="email" placeholder="إيميل دخوله">
        <select id="tp"><option value="shop">محل / مطعم (10 دولار)</option><option value="driver">سائق (5 دولار)</option></select>
        <button data-act="addMember">إضافة</button>
      </div>
    </div>
    <div id="listBox"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDh6GFQR5CzjnRLsrTS5FhWrHRZmLG5QSc",
  authDomain: "syria-bike.firebaseapp.com",
  projectId: "syria-bike",
  storageBucket: "syria-bike.firebasestorage.app",
  messagingSenderId: "417884008874",
  appId: "1:417884008874:web:f95dc7c3886c765b3bbbd3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const SHOP_FEE_USD = 10;
const DRIVER_FEE_USD = 5;
const USD_RATE = 20000;
const DAY = 24 * 60 * 60 * 1000;
const labels = {new:'طلب جديد', cooking:'قيد التحضير', ready:'جاهز للاستلام', onway:'في الطريق', delivered:'تم التوصيل'};

let allOrders = [];
let members = [];
let current = 1;
let started = false;

function fmt(x) { return Math.round(x).toLocaleString('ar-SY') + ' ل.س'; }
function isActive(m) { return m.paidUntil && m.paidUntil > Date.now(); }
function dateText(ms) { return new Date(ms).toLocaleDateString('ar-SY'); }

function startListening() {
  if (started) return;
  started = true;
  onSnapshot(collection(db, 'orders'), function(snap) {
    allOrders = snap.docs.map(function(d) { const o = d.data(); o.id = d.id; return o; });
    allOrders.sort(function(a, b) {
      const ta = a.createdAt ? a.createdAt.seconds : 0;
      const tb = b.createdAt ? b.createdAt.seconds : 0;
      return tb - ta;
    });
    render();
  });
  onSnapshot(collection(db, 'members'), function(snap) {
    members = snap.docs.map(function(d) { const m = d.data(); m.id = d.id; return m; });
    members.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    render();
  });
}

onAuthStateChanged(auth, function(user) {
  if (user) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    startListening();
  } else {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
});

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  document.getElementById('loginErr').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    document.getElementById('loginErr').textContent = 'الإيميل أو كلمة السر غير صحيحة';
  }
}

function stats() {
  const delivered = allOrders.filter(function(o) { return o.state === 'delivered'; });
  const sales = delivered.reduce(function(s, o) { return s + (o.subtotal || o.total); }, 0);
  const activeSubs = members.filter(isActive);
  const income = activeSubs.reduce(function(s, m) {
    return s + (m.type === 'driver' ? DRIVER_FEE_USD : SHOP_FEE_USD);
  }, 0);
  document.getElementById('sOrders').textContent = allOrders.length;
  document.getElementById('sActive').textContent = allOrders.filter(function(o) { return o.state !== 'delivered'; }).length;
  document.getElementById('sSales').textContent = fmt(sales);
  document.getElementById('sSubs').textContent = activeSubs.length + ' من ' + members.length;
  document.getElementById('sIncome').textContent = '$' + income + ' (' + fmt(income * USD_RATE) + ')';
}

function render() {
  stats();
  document.getElementById('t1').className = current === 1 ? 'active' : '';
  document.getElementById('t2').className = current === 2 ? 'active' : '';
  document.getElementById('addBox').style.display = current === 2 ? 'block' : 'none';
  const box = document.getElementById('listBox');

  if (current === 1) {
    if (allOrders.length === 0) { box.innerHTML = '<div class="empty">لا يوجد طلبات بعد</div>'; return; }
    box.innerHTML = allOrders.map(function(o) {
      const items = o.items.map(function(i) { return i.n + ' × ' + i.q; }).join('، ');
      const driver = o.driver ? '<div class="line">🚲 السائق: ' + o.driver + '</div>' : '';
      return '<div class="card"><span class="badge ' + o.state + '">' + labels[o.state] + '</span>' +
        '<h3>طلب رقم ' + o.id.slice(0, 6) + '</h3>' +
        '<div class="line">👤 ' + o.customer + ' · 📍 ' + o.address + '</div>' +
        '<div class="line">🍽️ ' + items + '</div>' +
        '<div class="line">💵 ' + fmt(o.total) + '</div>' + driver +
        '<button class="btn del" data-act="delOrder" data-id="' + o.id + '">حذف</button></div>';
    }).join('');
    return;
  }

  const list = members.map(function(m) {
    const active = isActive(m);
    const status = active
      ? '<span class="badge active-sub">مفعّل حتى ' + dateText(m.paidUntil) + '</span>'
      : '<span class="badge expired-sub">' + (m.paidUntil ? 'منتهي منذ ' + dateText(m.paidUntil) : 'غير مفعّل') + '</span>';
    const fee = m.type === 'driver' ? DRIVER_FEE_USD : SHOP_FEE_USD;
    return '<div class="card">' + status +
      '<h3>' + m.name + '</h3>' +
      '<div class="line">' + (m.type === 'driver' ? '🚲 سائق' : '🍽️ محل') + ' · الاشتراك $' + fee + ' بالشهر</div>' +
      '<div class="line">✉️ ' + (m.email || 'بدون إيميل') + '</div>' +
      '<button class="btn pay" data-act="pay" data-id="' + m.id + '">تفعيل شهر (استلمت المبلغ)</button>' +
      '<button class="btn mail" data-act="editMail" data-id="' + m.id + '">تعديل الإيميل</button>' +
      '<button class="btn del" data-act="delMember" data-id="' + m.id + '">حذف</button></div>';
  }).join('');

  box.innerHTML = list || '<div class="empty">لا يوجد محلات أو سائقين بعد</div>';
}

document.addEventListener('click', async function(e) {
  const t = e.target;
  if (t.id === 'loginBtn') { doLogin(); return; }
  if (t.id === 'logout') { signOut(auth); return; }
  if (t.id === 'changeRole') { localStorage.removeItem('sb_role'); location.href = 'index.html?choose=1'; return; }
  if (t.dataset.tab) { current = Number(t.dataset.tab); render(); return; }
  const act = t.dataset.act;
  if (!act) return;

  if (act === 'addMember') {
    const name = document.getElementById('nm').value.trim();
    const email = document.getElementById('em').value.trim().toLowerCase();
    const type = document.getElementById('tp').value;
    if (!name) { alert('اكتب الاسم'); return; }
    await addDoc(collection(db, 'members'), { name: name, email: email, type: type, paidUntil: 0, createdAt: Date.now() });
    document.getElementById('nm').value = '';
    document.getElementById('em').value = '';
  }
  if (act === 'pay') {
    const m = members.find(function(x) { return x.id === t.dataset.id; });
    const base = isActive(m) ? m.paidUntil : Date.now();
    await updateDoc(doc(db, 'members', m.id), { paidUntil: base + 30 * DAY });
  }
  if (act === 'editMail') {
    const m = members.find(function(x) { return x.id === t.dataset.id; });
    const v = prompt('اكتب الإيميل الجديد', m.email || '');
    if (v !== null) { await updateDoc(doc(db, 'members', m.id), { email: v.trim().toLowerCase() }); }
  }
  if (act === 'delMember' && confirm('حذف نهائي؟')) {
    await deleteDoc(doc(db, 'members', t.dataset.id));
  }
  if (act === 'delOrder' && confirm('هل تريد حذف هذا الطلب؟')) {
    await deleteDoc(doc(db, 'orders', t.dataset.id));
  }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('loginBox').style.display !== 'none') { doLogin(); }
});
</script>
</body>
</html>
